name: Compilar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/compilar_apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK con Gradle
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android-app
          arguments: assembleRelease --no-daemon
          gradle-version: 8.2

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: TransporteWidget-APK
          path: android-app/app/build/outputs/apk/**/*.apk
